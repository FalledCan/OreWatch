name: OreWatch
version: '${project.version}'
main: com.github.falledcan.orewatch.OreWatch
api-version: '1.19'
authors: [ falled_can ]
description: Admin tool that makes nearby ores glow, to help catch X-ray cheaters
website: https://github.com/FalledCan/OreWatch
commands:
  orewatch:
    description: Toggle glowing ores around you (admin only)
    usage: /orewatch [ore|all|off|reload]
    aliases: [ xray, ow ]
    permission: orewatch.use
permissions:
  orewatch.use:
    description: Allows using /orewatch
    default: op
  orewatch.reload:
    description: Allows using /orewatch reload
    default: op
